healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: coachai-server
    environment:
      ENGINE_URL: http://engine:8001
      PORT: "8000"
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    depends_on:
      engine:
        condition: service_health
    ports:
      - "8000:8000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g

volumes:
  engine_tmp:
    driver: local