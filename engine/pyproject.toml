[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# NOTE: runtime dependencies are declared in exactly one place —
# requirements.txt. Docker (pip install -r requirements.txt) and CI install
# from it; this file only carries packaging/tooling config (no `dependencies`
# list, on purpose).

[project]
name = "coachai-engine"
version = "0.1.0"
requires-python = ">=3.10"

[tool.vercel]
entrypoint = "main.py"

[tool.pytest.ini_options]
filterwarnings = [
    # google-genai 2.25 still constructs typing._UnionGenericAlias (private
    # API, deprecated on py3.14, removal slated for 3.17) at import time.
    # Fix avenues exhausted 2026-09-24, all with evidence:
    #  - upgrade: 2.25.0 is the newest release and still warns;
    #  - upstream main: raw.githubusercontent googleapis/python-genai main
    #    ships the identical `from typing import ... _UnionGenericAlias`
    #    plus `VersionedUnionType = Union[..., _UnionGenericAlias]`;
    #  - exact trigger (reproduced): evaluating that Union subscription
    #    runs parameter `==` comparison through
    #    _UnionGenericAliasMeta.__eq__ (stdlib typing.py:1700), which warns
    #    unconditionally — inside THEIR module-level code, so no import
    #    boundary, pre-seeding, or lazy import on our side can prevent it.
    #    The only alternatives are stdlib monkey-patching, vendoring the
    #    SDK, or downgrading Python — all strictly worse.
    # Scoped to google.genai only — warnings from our code and every other
    # dependency still surface. Drop this when google-genai ships a fix.
    'ignore:.*_UnionGenericAlias.*:DeprecationWarning:google\.genai.*',
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"cli/*.py" = ["E402"]