[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# NOTE: runtime dependencies are declared in exactly one place —
# requirements.txt. Docker (pip install -r requirements.txt) and CI install
# from it; this file only carries packaging/tooling config (no `dependencies`
# list, on purpose).

[project]
name = "coachai-engine"
version = "0.1.0"
requires-python = ">=3.10"

[tool.vercel]
entrypoint = "main.py"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"cli/*.py" = ["E402"]