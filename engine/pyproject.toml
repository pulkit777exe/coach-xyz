[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# NOTE: runtime dependencies are declared in exactly one place —
# requirements.txt. Docker (pip install -r requirements.txt) and CI install
# from it; this file only carries packaging/tooling config (no `dependencies`
# list, on purpose).

[project]
name = "coachai-engine"
version = "0.1.0"
requires-python = ">=3.10"

[tool.vercel]
entrypoint = "main.py"

[tool.pytest.ini_options]
filterwarnings = [
    # google-genai 2.25 still constructs typing._UnionGenericAlias (private
    # API, deprecated on py3.14, removal slated for 3.17) at import time.
    # Proven unfixable in-repo: their types.py:28 does
    # `from typing import ... _UnionGenericAlias`, and 2.25.0 is the newest
    # release — importing the SDK necessarily executes it. Scoped to
    # google.genai only — warnings from our code and every other dependency
    # still surface. Drop this when google-genai ships a fix.
    'ignore:.*_UnionGenericAlias.*:DeprecationWarning:google\.genai.*',
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"cli/*.py" = ["E402"]