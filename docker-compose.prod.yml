name: coachai-prod

services:
  engine:
    networks:
      - coachai_net
    build:
      context: ./engine
      dockerfile: Dockerfile
    image: coachai/engine:prod
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      PYTHONUNBUFFERED: "1"
      DATA_DIR: /app/data
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      SERVER_URL: ${FRONTEND_URL:-http://localhost:3000}
    expose:
      - "8001"
    volumes:
      - engine_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3).status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: "2.0"
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    init: true
    restart: unless-stopped
    networks:
      - coachai_net

  server:
    networks:
      - coachai_net
    build:
      context: ./server
      dockerfile: Dockerfile
    image: coachai/server:prod
    environment:
      ENGINE_URL: http://engine:8001
      PORT: 8000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL?DATABASE_URL is required}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      REQUIRE_SERVICE_TOKEN: "1"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_DOMAIN: ${RESEND_FROM_DOMAIN:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-CoachXYZ}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      engine:
        condition: service_healthy
    networks:
      - coachai_net
    ports:
      - "${PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "1.0"
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    init: true
    restart: unless-stopped
    networks:
      - coachai_net

  web-next:
    build:
      context: ./web-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://coachxyz.com}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: coachai-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://coachxyz.com}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:-https://coachxyz.com}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?AUTH0_DOMAIN is required}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?AUTH0_CLIENT_ID is required}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:?AUTH0_CLIENT_SECRET is required}
      AUTH0_SECRET: ${AUTH0_SECRET:?AUTH0_SECRET is required}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    init: true
    restart: unless-stopped
    networks:
      - coachai_net

networks:
  coachai_net:
    driver: bridge

volumes:
  engine_data:
    driver: local
