# CI — runs lint/type-check/tests/build for all three deployable services
# on every pull request and on pushes to main/master.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  engine:
    name: engine (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Keep in step with engine/Dockerfile: CI must exercise the Python
          # the engine actually ships on, or version-specific breakage (e.g.
          # threading.Lock being a class only from 3.13) lands unnoticed.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install dependencies
        working-directory: engine
        run: |
          pip install -r requirements.txt
          # Test/lint tooling is not part of the runtime requirements
          pip install pytest ruff

      - name: Ruff lint
        working-directory: engine
        run: ruff check .

      - name: Dependency audit
        working-directory: engine
        # Against requirements.txt (same set verified locally); fails the job
        # on any known CVE so upgrades stay deliberate.
        run: |
          pip install pip-audit
          python -m pip_audit -r requirements.txt

      - name: Pytest
        working-directory: engine
        run: pytest tests -q

  server:
    name: server (Bun)
    runs-on: ubuntu-latest
    # Raised from 25 on 2026-10-03, and the distinction matters: this is the JOB's
    # budget, not a test's. The suite spawns one fresh `bun` process per probe case
    # (~57 across the scope suites alone), and on a GitHub runner those spawns
    # intermittently take ~10s each instead of the ~0.9s median measured on a
    # laptop — the bounded `PROBE_TIMEOUT_MS` fires, SIGTERM lets the child exit
    # cleanly so the assertions still pass, and the suite finishes green while
    # spending ~10 minutes waiting. 57 x 10s is inside a healthy run, and the old
    # 25-minute job budget killed the job at 24m45s on a run whose tests were
    # passing.
    #
    # NOTE (2026-10-09): the ">10s per spawn" premise below has since been MEASURED and is
    # false — a fresh spawn costs 284-522ms on the runner against 290ms on a laptop, and an
    # in-suite probe 66-431ms against this suite's 10s budget. The budget was sized against
    # a cost model that measurement contradicts. It is left in place because it is not what
    # is breaking runs, but it must not be read as a fix for anything.
    #
    # This is deliberately NOT a raise of `--timeout` or `PROBE_TIMEOUT_MS`. Those
    # govern how long ONE test waits; raising them would make a genuine wedge cost
    # more, which is the wrong direction. The job budget only decides whether a
    # slow-but-passing suite gets to finish. The underlying slowness is still
    # unexplained and still CI-only — see the ledger entry — so if this number has
    # to be raised again, that is the signal to go and find it rather than to keep
    # buying headroom.
    timeout-minutes: 45
    # Ephemeral Postgres: TEST_DATABASE_URL-gated suites (student delete,
    # offboarding, archive, data-rights, scope SQL) skip without it — the
    # service keeps them green in CI instead of silently skipped. PERF_*
    # points at the same instance for script compatibility; nothing
    # destructive ever runs against Neon from CI (DATABASE_URL stays unset).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coachxyz
          POSTGRES_PASSWORD: coachxyz
          POSTGRES_DB: coachxyz
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U coachxyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://coachxyz:coachxyz@localhost:55433/coachxyz
      PERF_DATABASE_URL: postgres://coachxyz:coachxyz@localhost:55433/coachxyz
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Dependency audit
        working-directory: server
        # Fails the job on any known CVE (verified clean locally: 191 packages).
        run: bun audit

      - name: Type check
        working-directory: server
        run: bun run type-check

      - name: Lint
        working-directory: server
        run: bun run lint

      # `bun run test`, never bare `bun test` — the script's flags are the
      # contract and re-spelling the command here silently drops both:
      # --timeout 30000 (Bun's default is 5s, which kills the probe-spawning
      # tests mid-flight) and --isolate (a mock.module in one file otherwise
      # replaces that module for every file after it, so the suite's result
      # depends on readdir order — alphabetical here, scrambled on the runner).
      #
      # The skip tally is asserted in the SAME step, off the same run, because a
      # skipped test is not a failing test — and that is exactly why 43 of them
      # survived here for months. Ten live-Postgres suites gated on
      # `Boolean(process.env.DATABASE_URL)` — the LIVE Neon URL, which this
      # workflow deliberately leaves unset — so every run reported green while the
      # live-SQL scope enforcement never executed once. Nothing inside the suite
      # can catch that, because a skip is a legitimate outcome; only the tally
      # can. `TEST_DATABASE_URL` is set above, so 0 is the honest number. If a
      # skip is ever genuinely correct, fix the gate rather than raising this
      # count — it is pinned here BECAUSE it was silently wrong once already.
      #
      # `set -o pipefail` so the step still fails on a non-zero test exit; without
      # it the pipe into `tee` would discard the status and a red suite would
      # pass this step. The exit-code check is kept explicit because that is the
      # one thing a reader cannot infer.
      - name: Test (and assert nothing is skipped)
        working-directory: server
        run: |
          set -o pipefail
          bun run test 2>&1 | tee /tmp/server-test.log
          # Strip ANSI first. Bun disables colour when stdout is not a TTY, and
          # the pipe into `tee` guarantees that here — but an assertion that
          # silently passes on a colourised summary is precisely the failure this
          # step exists to catch, so it must not depend on that holding.
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/server-test.log > /tmp/server-test.plain.log
          # `|| true` is load-bearing, and its absence is a bug this gate shipped
          # with on its first run. With NO matches grep exits 1, pipefail
          # propagates that, and GitHub's default `bash -e` shell then aborts the
          # step at the ASSIGNMENT — before the `if` below ever runs. So the
          # healthy case (0 skips) failed the job and the unhealthy case was the
          # only one that worked. Rehearsing the assertion outside `bash -e`
          # cannot catch this; the shell's errexit is part of the behaviour.
          skipped=$(grep -oE '[0-9]+[[:space:]]+skip\b' /tmp/server-test.plain.log | grep -oE '[0-9]+' | head -1 || true)
          skipped=${skipped:-0}
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped tests skipped in CI. Every suite must run against the ephemeral Postgres; a skip means a gate is reading the wrong variable — see the DATABASE_URL entry in AGENTS.md."
            exit 1
          fi
          echo "0 skipped — full coverage"

      # ── Where the probe spawn cost actually goes ──────────────────────────────
      # Runs on EVERY server run, not only red ones, because the failure is intermittent:
      # the suite fails 46 tests, then 167, then passes the identical code — so the
      # evidence from the run that happened to catch it is the only evidence there is,
      # and gating this on `failure()` would collect nothing for exactly the runs that
      # need it.
      #
      # Every previous claim about the cause was INFERRED from the timeouts. This is the
      # one that was never measured: that a spawn costs ~10s on the runner against ~0.9s
      # on a laptop. It splits the spawn into exec+load / module-graph / teardown, and
      # separates `NEVER BOOTED` (the child never reached its first statement) from
      # `EXIT HANG` (it finished all its work and never exited) — two defects the test
      # helper cannot tell apart and with different fixes.
      #
      # Scoped to the composed app plus the bare-spawn control, at 3 repeats: ~7s on a
      # healthy runner, and bounded by the child budget otherwise. The bare row is the
      # control and must stay ~10ms — if IT is slow the problem is the runner's process
      # cost, not this repository's module graph.
      # `if: always()` is LOAD-BEARING and its absence was the bug this step was written to
      # fix. Without it a step runs only when every PREVIOUS step succeeded — so on a red
      # run, the one step that explains WHY it was red was the one step skipped. I shipped
      # exactly that on the first attempt, having written a whole ledger entry about gates
      # that read the wrong variable, and the tell was the same: a step whose value is
      # highest precisely when it is least likely to execute.
      - name: Measure probe spawn cost
        if: always()
        working-directory: server
        env:
          PROBE_BOOT_REPEATS: '3'
          PROBE_BOOT_CHILD_BUDGET_MS: '30000'
        # `--only=app.ts` now matches TWO rows: a bare composed-app import, and the same
        # import preceded by `bun:test` + a redis mock, which is what a real probe does.
        # The gap between those two numbers, measured on the runner, is the whole question:
        # a fresh import costs 284ms there against 290ms on a laptop, yet the probes it
        # stands in for were hitting a 10s budget.
        run: bun scripts/probeBootCost.ts --preset=ci --only=app.ts --json

      # ── Time the probes that ACTUALLY failed, on the runner ────────────────────────
      # Every measurement so far has been of a SYNTHETIC import, and every one of them was
      # fast: 284-522ms on the runner against 290ms on a laptop, while the probes they stood
      # in for were hitting a 10s budget. So this runs the real probe files — the ones named
      # in the red runs — through `--probes`, several times each, under the same CI env.
      #
      # It runs on EVERY run, not `failure()`, for the reason the step above does: the
      # failure is intermittent, so the evidence from the run that happened to catch it is
      # the only evidence there is. Three repeats over a filtered set is seconds on a healthy
      # runner and bounded by the child budget otherwise.
      #
      # The output is a distribution, not a single number, because the claim under test is
      # "a large minority of spawns take ~10s". If the distribution here is tight, the cost
      # model is dead and the cause is a per-spawn FAILURE; if it has a tail, the tail is the
      # thing to explain.
      - name: Time the real probes
        if: always()
        working-directory: server
        env:
          PROBE_BOOT_CHILD_BUDGET_MS: '30000'
          PROBE_BOOT_REPEATS: '3'
        run: |
          # The six named in the two red runs, by the substring `--probes` matches on.
          for probe in downloadAudit emailTemplate archive analyzeOrg attendancePerformance emailRouteGuards; do
            echo "::group::probe: $probe"
            bun scripts/probeBootCost.ts --preset=ci --probes="$probe" || true
            echo "::endgroup::"
          done

      # Surfaced as a warning rather than a failure: this run's verdict is the tests, and a
      # slow spawn that the bounded budget absorbed is not itself a red suite. It is
      # annotated so the next run's log says "spawn was slow" instead of leaving the cause
      # to be re-derived from a timeout count.
      - name: Flag a slow spawn
        working-directory: server
        if: always()
        continue-on-error: true
        # A real file, not an inline `bun -e` block. The inline version shipped with an
        # unbalanced backtick and died with `Unterminated string literal` on every run since
        # ead12ba; `continue-on-error` swallowed it, so the step reported nothing for its whole
        # life. Nothing could have caught it there: a YAML block scalar is not linted, not
        # typechecked and not parsed by any gate. `eslint .` runs earlier in THIS job and does
        # cover `server/scripts/`, so the same defect now fails at the Lint step instead of
        # silently.
        run: bun scripts/flagSlowSpawn.ts

  web-next:
    name: web-next (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bun is the package manager, matching the server job and the committed
      # `bun.lock`. There is no package-lock.json: two lockfiles in one package
      # meant an `npm ci` and a `bun install` could resolve different trees, and
      # the disagreement only surfaced in CI. Node stays the runtime Next builds
      # and runs on.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web-next
        run: bun install --frozen-lockfile

      - name: Dependency audit
        working-directory: web-next
        # Same policy the image scan already applies (`ignore-unfixed: true` with
        # severity HIGH,CRITICAL): a finding is fatal when a fix EXISTS, and an
        # unfixable one must not hold the branch hostage. `bun audit` has no
        # --ignore-unfixed, so the unfixable set is named explicitly instead.
        #
        # GHSA-vfj7-8cjw-p6xm — braces@3.0.3 stack-exhaustion DoS. No fixed
        # version is published (3.0.3 is the newest; OSV reports no `fixed`
        # event), so `bun audit fix` cannot clear it. It is reached only as
        # eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch,
        # i.e. ESLint's own glob matching: a devDependency that never reaches the
        # browser bundle or the server runtime.
        #
        # DELETE THIS FLAG as soon as braces ships a fix — that is the whole
        # condition, not a date. Named per-GHSA rather than by severity so any
        # OTHER high or critical advisory still fails the job, and the step's
        # output reports "1 ignored" rather than hiding it.
        run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm

      - name: Type check
        working-directory: web-next
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web-next
        run: npm run lint

      - name: Unit tests (vitest)
        working-directory: web-next
        run: npm test

      - name: Build
        working-directory: web-next
        run: npx next build

  # Image scan: both deployable images, HIGH/CRITICAL only, fail-closed.
  # Trivy action pinned to a verified tag (v0.36.0, checked 2026-09-29).
  scan:
    name: image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t coachxyz-server:ci ./server

      - name: Build engine image
        run: docker build -t coachxyz-engine:ci ./engine

      - name: Scan server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: coachxyz-server:ci
          format: table
          severity: HIGH,CRITICAL
          # Ignore CVEs with no upstream fix (Debian base-image backlog):
          # nothing on our side can resolve them, and they would hold the
          # gate red indefinitely. Anything fixable still fails the build.
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan engine image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: coachxyz-engine:ci
          format: table
          severity: HIGH,CRITICAL
          # Same policy as above: only fixable findings fail the build.
          ignore-unfixed: true
          exit-code: '1'
