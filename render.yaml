# render.yaml — Deploy coach-xyz to Render (free tier)
# Docs: https://render.com/docs/render.yaml

services:
  # ── Engine (Python/FastAPI — video processing + Gemini AI) ─────────────────
  - type: web
    name: coachai-engine
    runtime: docker
    rootDir: engine
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LOCAL_STORAGE_DIR
        value: /tmp/storage
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

  # ── Server (Bun/Elysia — middleware + BullMQ worker) ──────────────────────
  - type: web
    name: coachai-server
    runtime: docker
    rootDir: server
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENGINE_URL
        fromService:
          name: coachai-engine
          property: host
      - key: FRONTEND_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: NODE_ENV
        value: production