# render.yaml — Deploy coach-xyz to Render
# Hybrid billing: engine on paid starter, server on free.
# Docs: https://render.com/docs/render.yaml

services:
  # ── Engine (Python/FastAPI — video processing + Gemini AI) ─────────────────
  # Paid "starter" plan: free tier spins down after 15 min idle, which kills
  # in-flight background analyses and wipes /tmp/storage. Videos are local-only
  # (storage.py is_local_backend), so the filesystem is still ephemeral across
  # deploys/restarts even on paid plans — keep demo clips short.
  - type: web
    name: coachai-engine
    runtime: docker
    rootDir: engine
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Persistence root: SQLite DB, uploaded objects, rendered results.
      # Render disks are ephemeral across deploys — keep demo clips short.
      - key: DATA_DIR
        value: /app/data
      # Shared secret with the server. The engine refuses to boot in
      # production without it (see engine/main.py lifespan).
      - key: SERVICE_TOKEN
        sync: false
      # Browser-facing origin allowed by CORS. The browser never calls the
      # engine directly, but keep it explicit (no wildcard) in production.
      - key: SERVER_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ENVIRONMENT
        value: production

  # ── Server (Bun/Elysia — middleware + Postgres durable queue) ─────────────
  # Free plan is fine: tiny footprint, fits 512 MB. The queue worker lives in
  # this process; the keepalive workflow (.github/workflows/keepalive.yml) pings
  # /health every 9 min so the free instance never cold-starts and the worker
  # stays continuous (engine is on paid starter, so this fits the 750 h/mo free
  # budget).
  - type: web
    name: coachai-server
    runtime: docker
    rootDir: server
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENGINE_URL
        fromService:
          name: coachai-engine
          property: host
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Identity boundary: the server refuses to boot without SERVICE_TOKEN
      # when REQUIRE_SERVICE_TOKEN=1, and the engine requires the same value.
      - key: SERVICE_TOKEN
        sync: false
      - key: REQUIRE_SERVICE_TOKEN
        value: "1"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_DOMAIN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: NODE_ENV
        value: production
