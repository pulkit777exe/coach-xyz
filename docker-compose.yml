services:
  engine:
    networks:
      - coachai_net
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: coachai-engine
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      DATA_DIR: /app/data
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      SERVER_URL: http://localhost:8000
    ports:
      - "8001:8001"
    volumes:
      - engine_data:/app/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  server:
    networks:
      - coachai_net
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: coachai-server
    environment:
      ENGINE_URL: http://engine:8001
      PORT: "8000"
      DATABASE_URL: "postgresql://coachai:coachai@database:5432/coachai?sslmode=disable"
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
      engine:
        condition: service_healthy
    ports:
      - "8000:8000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g

  database:
    networks:
      - coachai_net
    image: postgres:16-alpine
    container_name: coachai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coachai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coachai}
      POSTGRES_DB: ${POSTGRES_DB:-coachai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "coachai", "-d", "coachai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web-next:
    networks:
      - coachai_net
    build:
      context: ./web-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: coachai-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      NODE_ENV: production
      APP_BASE_URL: http://localhost:3000
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_SECRET: ${AUTH0_SECRET}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_RUNTIME_CHANNEL_INJECTION: "0"
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    init: true
    restart: unless-stopped

networks:
  coachai_net:
    driver: bridge

volumes:
  engine_data:
    driver: local
  pgdata:
    driver: local
