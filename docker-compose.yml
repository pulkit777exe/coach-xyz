services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: coachai-engine
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - engine_tmp:/app/tmp
    init: true
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: coachai-server
    environment:
      ENGINE_URL: http://engine:8001
      PORT: ${PORT:-8000}
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    init: true
    restart: unless-stopped

volumes:
  engine_tmp:
